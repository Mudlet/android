# Shared 4-core machine: keep Gradle small and single-use.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# arm64-v8a for phones, x86_64 for the emulator: -PandroidAbi=x86_64
androidAbi=arm64-v8a

# Qt Gradle Plugin 1.4 configuration (relative paths resolve against the root project)
qtPath=/home/vadi/Programs/Qt/6.12.0
qtProjectPath=../qtapp
# Qt 6.12 was built with NDK 27.2 but only 28.2 is installed; Qt's install has no QT_HOST_PATH baked in;
# The ninja wrapper (plugin runs "ninja aar" with no -j) is set as QtBuild.ninjaPath in app/build.gradle.kts.
qtExtraCMakeArguments=-DCMAKE_BUILD_TYPE=Release,-DQT_HOST_PATH=/home/vadi/Programs/Qt/6.12.0/gcc_64,-DANDROID_NDK_ROOT=/home/vadi/Android/Sdk/ndk/28.2.13676358
