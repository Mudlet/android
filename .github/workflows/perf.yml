name: Engine benchmark

# What a game's spam costs the app's engine, beside what Mudlet's own pipeline costs on the same runner: Mudlet's
# PipelineBenchmark (test/functional_tests/PipelineBenchmark.cpp, desktop's pipeline through its loopback, no socket)
# and native/tests/spam_bench.py (the engine host with libmudlet, a fake game's fight and floods, through the socket
# protocol). Both are built in release without sanitizers from the same Mudlet checkout, with scripts/mudlet-patches/
# applied, and run in turns three times, each with the runner's load beside it. A runner's numbers are only worth
# setting beside another run's on the same kind of runner, and best against each other: the ratio of the engine's
# lines a second to desktop's is the figure to compare. Manual only: it builds Mudlet twice and gates nothing.
on:
  workflow_dispatch:
    inputs:
      mudlet-ref:
        description: Mudlet/Mudlet branch, tag or full commit SHA to build
        type: string
        default: development

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MUDLET_REF: ${{ inputs.mudlet-ref }}

jobs:
  benchmark:
    name: Engine benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Mudlet/Mudlet
          ref: ${{ env.MUDLET_REF }}
          path: mudlet
          # The desktop GUI that PipelineBenchmark links builds edbee-lib and qt-tags-widget
          submodules: recursive

      - id: toolchain
        uses: ./.github/actions/android-toolchain
        with:
          # libmudlet.yml's desktop-engine packages
          apt-packages: >-
            lua5.1 libboost-dev libhunspell-dev libpcre2-dev libpugixml-dev libsqlite3-dev libyajl-dev libzip-dev
            qtkeychain-qt6-dev zlib1g-dev libgl-dev libopengl-dev libegl1 libxkbcommon0 libfontconfig1 libpulse0
            liblua5.1-0-dev luarocks unzip

      # As libmudlet.yml's desktop-engine, with the desktop GUI's WebSockets and HttpServer
      - name: Host Qt modules for Mudlet
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-host"
          "$RUNNER_TEMP/aqt-host/bin/pip" install -q "aqtinstall==3.3.0"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aqt-host/bin/aqt" install-qt linux desktop ${{ steps.toolchain.outputs.qt-version }} linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/qt-host" --archives qtsvg -m qt5compat qtmultimedia qtspeech qtwebsockets qthttpserver
          cp -r --update=none "$RUNNER_TEMP/qt-host/${{ steps.toolchain.outputs.qt-version }}/gcc_64/." "$QT_ROOT/gcc_64/"

      - name: Build libmudlet and the engine
        run: |
          scripts/build-libmudlet-desktop.sh mudlet build-desktop
          cmake -S native -B native/build-desktop-mudlet -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT/gcc_64" \
            -DLIBMUDLET_BUILD_DIR="$GITHUB_WORKSPACE/build-desktop"
          cmake --build native/build-desktop-mudlet --target engine

      # From the checkout build-libmudlet-desktop.sh patched, so both run the same Mudlet
      - name: Build PipelineBenchmark
        run: |
          cmake -S mudlet -B build-bench -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT/gcc_64" \
            -DUSE_SANITIZER= -DBUILD_TESTING=ON -DUSE_UPDATER=OFF -DUSE_3DMAPPER=OFF -DUSE_DISCORD_RPC=OFF \
            -DWITH_SENTRY=OFF -DUSE_MCPSERVER=OFF
          # USE_SANITIZER otherwise defaults to address, which halves text throughput
          if grep -E '^USE_SANITIZER:[A-Z]+=.+' build-bench/CMakeCache.txt; then exit 1; fi
          cmake --build build-bench --target PipelineBenchmark

      # Desktop Mudlet requires its Lua modules from LuaRocks, as Mudlet's own CI installs them before its training run;
      # libmudlet has them built in, so only PipelineBenchmark is given their paths
      - name: Lua rocks for PipelineBenchmark
        run: |
          mudlet/CI/install-lua-rocks.sh lua-yajl
          mudlet/CI/install-lua-rocks.sh
          mudlet/CI/install-lua-rocks.sh --check
          luarocks path --local --lua-version 5.1 > "$RUNNER_TEMP/rocks.sh"

      # Each run's whole output is kept in results/, and a failure prints its tail and exit code and lets the other
      # runs go on, so one failing run says what failed
      - name: Run them in turns
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p results
          failed=0
          bench() {
            local out=$1
            shift
            echo "# run $run: $(nproc) cores, $(uptime)" > "results/$out.txt"
            local code=0
            "$@" > "results/$out.log" 2>&1 || code=$?
            grep '^METRIC' "results/$out.log" >> "results/$out.txt" || true
            if [ "$code" -ne 0 ]; then
              echo "::error::$out exited with $code"
              tail -n 60 "results/$out.log"
              failed=1
            fi
          }
          # shellcheck disable=SC2329 # bench runs it
          desktop() {
            local scratch
            scratch=$(mktemp -d)
            # shellcheck disable=SC1091
            (. "$RUNNER_TEMP/rocks.sh" && cd build-bench && HOME=$scratch XDG_CONFIG_HOME=$scratch/.config MUDLET_TEST_MODE=1 \
              test/functional_tests/PipelineBenchmark)
          }
          for run in 1 2 3; do
            bench "desktop-$run" desktop
            bench "engine-$run" python3 native/tests/spam_bench.py native/build-desktop-mudlet/enginehost/engine
          done
          {
            echo "### Mudlet/Mudlet \`$MUDLET_REF\` at $(git -C mudlet log -1 --format='%h')"
            echo
            echo '| metric | run 1 | run 2 | run 3 |'
            echo '| --- | --- | --- | --- |'
            for side in desktop engine; do
              { grep -h '^METRIC' "results/$side-1.txt" || true; } | while read -r _ name _; do
                printf '| %s %s |' "$side" "$name"
                for run in 1 2 3; do printf ' %s |' "$(awk -v n="$name" '$2 == n { print $3 }' "results/$side-$run.txt")"; done
                echo
              done
            done
            echo
            grep -h '^# run' results/*.txt | sort -u | sed 's/^# /- /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: engine-benchmark
          path: results/
