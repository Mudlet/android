name: Checks

# The static checks in scripts/lint.sh: ktlint, clang-format, ShellCheck and actionlint, each called by ci.yml when a
# file it covers changed. Android lint needs the staged Qt jars, so it runs in apks.yml after the APK is built.
on:
  workflow_call:
    inputs:
      ktlint:
        description: Run ktlint
        type: boolean
        default: true
      lint-checks:
        description: The other checks to run, a JSON list of scripts/lint.sh's names
        type: string
        default: '["clang-format", "shellcheck", "actionlint"]'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ktlint:
    if: inputs.ktlint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # the wrapper's Gradle, cached, and its jar checked
      - uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: scripts/lint.sh ktlint

  lint:
    name: ${{ matrix.check }}
    if: inputs.lint-checks != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(inputs.lint-checks) }}
    steps:
      - uses: actions/checkout@v7

      - name: ${{ matrix.check }}
        run: scripts/lint.sh ${{ matrix.check }}
