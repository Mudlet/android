name: Prototype APKs

# Debug APKs of the three hosting prototypes, each with its stand-in engine, for arm64-v8a, after each
# prototype's desktop engine test, and C a second time with its libraries extracted at install.
on:
  push:
    branches: [main]
    paths: &paths
      - a-inprocess-service/**
      - b-quickview/**
      - c-separate-process/**
      - .github/actions/**
      - .github/workflows/apks.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: ${{ matrix.prototype }}${{ matrix.extracted && ' (extracted libs)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - prototype: a-inprocess-service
            gradle: "8.14.3"
            desktop-test: |
              cmake -S desktop -B build-desktop -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT/gcc_64"
              cmake --build build-desktop
              ctest --test-dir build-desktop --output-on-failure
            build: gradle --no-daemon -PqtRoot="$QT_ROOT" -PandroidAbi=arm64-v8a :app:assembleDebug
            engine: libmudletproto
            apk: a-inprocess-service/app/build/outputs/apk/debug
          - prototype: b-quickview
            gradle: wrapper
            desktop-test: |
              cmake -S engine -B build-desktop -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT/gcc_64"
              cmake --build build-desktop
              ctest --test-dir build-desktop --output-on-failure
            build: |
              cd android
              ./gradlew --no-daemon -PqtPath="$QT_ROOT" -PandroidAbi=arm64-v8a \
                -PqtExtraCMakeArguments="-DCMAKE_BUILD_TYPE=Release,-DQT_HOST_PATH=$QT_ROOT/gcc_64,-DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" \
                :app:assembleDebug
            engine: libmudengine
            apk: b-quickview/android/app/build/outputs/apk/debug
          - prototype: c-separate-process
            gradle: "8.14.3"
            desktop-test: |
              cmake -S . -B build-desktop -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT/gcc_64"
              cmake --build build-desktop --target engine
              python3 tests/test_engine.py build-desktop/enginehost/engine
            build: ./build-apk.sh
            engine: libengine
            apk: c-separate-process/android/app/build/outputs/apk/debug
          # what extracting the libraries at install costs; see "Native libraries" in C's REPORT.md
          - prototype: c-separate-process
            gradle: "8.14.3"
            build: ./build-apk.sh -PextractNativeLibs=true
            engine: libengine
            apk: c-separate-process/android/app/build/outputs/apk/debug
            extracted: true
    steps:
      - uses: actions/checkout@v6

      - id: toolchain
        uses: ./.github/actions/android-toolchain
        with:
          # host Qt Gui, which the desktop engines link, needs the OpenGL headers to configure and the rest to run
          apt-packages: libgl-dev libopengl-dev libegl1 libxkbcommon0 libfontconfig1

      # A and C build with this Gradle (they have no wrapper); B uses its own wrapper
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Desktop engine test
        if: matrix.desktop-test
        working-directory: ${{ matrix.prototype }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: ${{ matrix.desktop-test }}

      - name: Build APK
        working-directory: ${{ matrix.prototype }}
        run: ${{ matrix.build }}

      # Gradle packages whatever androiddeployqt staged, so a partial deploy still gives an APK
      - name: Check APK
        working-directory: ${{ matrix.apk }}
        env:
          TITLE: ${{ matrix.prototype }}${{ matrix.extracted && ' (extracted libs)' || '' }}
          EXTRACTED: ${{ matrix.extracted || false }}
        run: |
          readelf="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          aapt2="${{ steps.toolchain.outputs.build-tools-dir }}/aapt2"
          mb() { awk -v b="$1" 'BEGIN { printf "%.1f MB", b / 1000000 }'; }
          printf '### %s\n\n' "$TITLE" >> "$GITHUB_STEP_SUMMARY"
          for apk in *.apk; do
            libs="$RUNNER_TEMP/$apk/lib/arm64-v8a"
            unzip -q -o "$apk" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/$apk" \
              || { echo "::error::cannot extract lib/arm64-v8a/*.so from $apk"; exit 1; }
            for lib in libQt6Core_arm64-v8a.so libplugins_platforms_qtforandroid_arm64-v8a.so libc++_shared.so \
                       ${{ matrix.engine }}_arm64-v8a.so; do
              [ -f "$libs/$lib" ] || { echo "::error::$apk has no lib/arm64-v8a/$lib"; exit 1; }
            done
            # a 16 KB page device needs both: each library at a 16 KB offset in the APK, and 16 KB aligned segments
            "${{ steps.toolchain.outputs.build-tools-dir }}/zipalign" -c -P 16 4 "$apk" \
              || { echo "::error::$apk does not store its libraries at 16 KB offsets"; exit 1; }
            sos=("$libs"/*.so)
            for so in "${sos[@]}"; do
              aligns=$("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }')
              [ -n "$aligns" ] || { echo "::error::no LOAD segments read from $so"; exit 1; }
              for a in $aligns; do
                (( a >= 0x4000 )) || { echo "::error::$apk: $(basename "$so") has segments aligned to $a, below 16 KB"; exit 1; }
              done
            done
            # zipalign -c passes compressed libraries; the installer extracts the libraries when the manifest's
            # extractNativeLibs is not false, and refuses compressed ones when it is
            stats=$(unzip -v "$apk" 'lib/arm64-v8a/*.so' \
              | awk '$8 ~ /^lib\// { n++; if ($2 != "Stored") d++; u += $1; c += $3 } END { print n+0, d+0, u+0, c+0 }')
            read -r count deflated raw packed <<< "$stats"
            (( count == ${#sos[@]} )) \
              || { echo "::error::$apk: unzip -v listed $count libraries, but ${#sos[@]} were extracted"; exit 1; }
            manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
            grep -q 'E: application' <<< "$manifest" || { echo "::error::no <application> in $apk's manifest dump"; exit 1; }
            flag=$(sed -n 's/.*:extractNativeLibs([^)]*)=\([a-z]*\).*/\1/p' <<< "$manifest")
            apk_size=$(stat -c %s "$apk")
            if [ "$EXTRACTED" = true ]; then
              (( deflated == count )) \
                || { echo "::error::$apk compresses $deflated of its $count libraries, so useLegacyPackaging was not on"; exit 1; }
              [ "$flag" != false ] \
                || { echo "::error::$apk compresses its libraries, but its manifest has extractNativeLibs=false"; exit 1; }
              how="compressed to $(mb "$packed") and extracted at install"
              installed=$(( apk_size + raw ))
            else
              (( deflated == 0 )) \
                || { echo "::error::$apk compresses $deflated of its $count libraries, which the default build stores: is useLegacyPackaging on?"; exit 1; }
              [ "$flag" = false ] \
                || { echo "::error::$apk's manifest has extractNativeLibs=${flag:-unset}, so the installer extracts its libraries"; exit 1; }
              how="stored, loaded from the APK"
              installed=$apk_size
            fi
            echo "- \`$apk\`: $(mb "$apk_size"); \`lib/arm64-v8a\`: $count libraries, $(mb "$raw"), $how" \
              "(extractNativeLibs=${flag:-unset}); on the device: $(mb "$installed")" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.prototype }}${{ matrix.extracted && '-extracted-libs' || '' }}-debug-apk
          path: ${{ matrix.apk }}/*.apk
          if-no-files-found: error
          retention-days: 14
