name: Check APK
description: >
  Checks each debug APK in a directory with scripts/check-apk.sh: that it holds Qt and the engine library, and
  OpenSSL as Qt's TLS backend loads it, that its libraries are 16 KB aligned (their offsets in the APK and their load
  segments), and that they are stored or compressed as the manifest's extractNativeLibs says; then adds each APK's
  size, its size on the device, and OpenSSL's share, to the job summary.
inputs:
  apk-dir:
    description: Directory holding the APKs
    required: true
  engine:
    description: The engine library's name, without the ABI suffix (libengine for libengine_arm64-v8a.so)
    required: true
  title:
    description: Heading in the job summary
    required: true
  extracted:
    description: "true when the APK was built to extract its libraries at install (useLegacyPackaging)"
    default: "false"
  build-tools-dir:
    description: The SDK build-tools directory (zipalign, aapt2), as android-toolchain outputs it
    required: true
  abi:
    description: The APK's ABI
    default: arm64-v8a
runs:
  using: composite
  steps:
    # Gradle packages whatever androiddeployqt staged, so a partial deploy still gives an APK
    - name: Check APK
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        EXTRACTED: ${{ inputs.extracted }}
        ENGINE: ${{ inputs.engine }}
        BUILD_TOOLS: ${{ inputs.build-tools-dir }}
        ABI: ${{ inputs.abi }}
        APK_DIR: ${{ inputs.apk-dir }}
      run: scripts/check-apk.sh "$APK_DIR"
