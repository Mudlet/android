name: up0052 BuiltinMudletLuaTest (throwaway)

# Throwaway, never for main: builds Mudlet (development 2837eb8c5 with scripts/mudlet-patches) as Mudlet's own Linux CI
# does, runs BuiltinMudletLuaTest, then each bite in .github/up0052-bites and expects it red.
on:
  push:
    branches: [ccr-14671218-tf96z6-up0052-test-ci]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      MUDLET_REF: 2837eb8c581940c68c41028bbf811c057f814d4b
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Mudlet/Mudlet
          ref: ${{ env.MUDLET_REF }}
          path: mudlet

      - name: Submodules the GUI build needs
        run: git -C mudlet submodule update --init --depth 1 3rdparty/edbee-lib 3rdparty/lcf 3rdparty/qt-tags-widget 3rdparty/qtkeychain

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          dir: ${{ runner.temp }}
          cache: false
          modules: qt5compat qtmultimedia qtspeech qtwebsockets qthttpserver

      - name: Dependencies (Mudlet's Linux CI list)
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build g++-12 libassimp-dev libboost-dev libcurl4-openssl-dev \
            libglu1-mesa-dev libhunspell-dev liblua5.1-0-dev lua5.1 libonig-dev libpcre2-dev libpulse-dev libpugixml-dev \
            libsecret-1-dev libspeechd-dev libsqlite3-dev libssl-dev libxkbcommon-x11-0 libxcb-render-util0-dev \
            libxcb-image0-dev libyajl-dev libzip-dev qtkeychain-qt6-dev pcre2-utils pkg-config

      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-up0052-${{ github.run_id }}
          restore-keys: ccache-up0052-

      - name: Apply the carried patches
        run: scripts/apply-mudlet-patches.sh mudlet

      # moc takes the // of a URL inside patch 0014's raw string for a comment and fails the whole group;
      # HeadlessSessionWindowsTest is not run here, so only that one href changes
      - name: Work around AutoMoc on HeadlessSessionWindowsTest.cpp
        run: |
          f=mudlet/test/functional_tests/HeadlessSessionWindowsTest.cpp
          grep -q 'href="https://example.org/a?b=1&amp;c=2"' "$f"
          sed -i 's|href="https://example.org/a?b=1&amp;c=2"|href="https:/ /example.org/a?b=1\&amp;c=2"|' "$f"
          ! grep -q 'href="https://example.org/a?b=1&amp;c=2"' "$f"

      - name: Configure
        run: |
          cmake -S mudlet -B b -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUSE_SANITIZER= -DBUILD_TESTING=ON \
            -DUSE_UPDATER=OFF -DUSE_3DMAPPER=OFF -DWITH_SENTRY=OFF -DUSE_MCPSERVER=OFF -DUSE_FONTS=OFF \
            -DUSE_BUNDLED_LUA_MODULES=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build functional_teardown_tests
        run: cmake --build b --target functional_teardown_tests -j "$(nproc)"

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-up0052-${{ github.run_id }}

      - name: Green, with the change
        working-directory: b
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest -R '^BuiltinMudletLuaTest$' --output-on-failure

      - name: Bites, each must be red
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          status=0
          for bite in .github/up0052-bites/*.patch; do
            name=$(basename "$bite")
            git -C mudlet apply "$PWD/$bite"
            cmake --build b --target functional_teardown_tests -j "$(nproc)"
            echo "::group::$name"
            if (cd b && ctest -R '^BuiltinMudletLuaTest$' --output-on-failure); then
              echo "::error::$name: BuiltinMudletLuaTest passed with the bite (vacuous)"
              status=1
            else
              echo "BITE $name: red as meant"
            fi
            echo "::endgroup::"
            git -C mudlet apply -R "$PWD/$bite"
          done
          exit $status
