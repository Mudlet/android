name: CI

# The one workflow that pull requests and pushes to main start. It looks at which files changed and calls only the
# workflows those files need (checks.yml, libmudlet.yml), then reports one result, "CI result", which is
# the check to require: a workflow a path filter left out never reports, and a skipped job counts as passed. The nightly
# runs the libmudlet jobs against Mudlet's latest development, the only ones that can break with no change here, and
# opens or updates an issue when they fail; a manual run runs everything.
#
# What runs for what changed (the filters in "changes" below say it exactly):
#   any file                      the conflict-marker check (scripts/lint.sh conflict-markers)
#   Mudlet patches                the vendored check (scripts/lint.sh vendored)
#   the games list (app/src/main/assets/games), scripts/sync-mudlet-games.py
#                                 the games check (scripts/lint.sh games)
#   docs, README and the like     only this workflow's own small jobs (docs/protocol.md: the real engine on the host,
#                                 whose ProtocolSpecTest reads it)
#   Kotlin (app/, engine-service/, protocol/, suggest/)
#                                 ktlint, the arm64 APK with libmudlet (with the JVM tests and Android lint) and the
#                                 emulator suite (smoke test and the instrumented tests, on minSdk and the newest API),
#                                 libmudlet from its cache; protocol/ also the real engine on the host, which runs its
#                                 tests; app/ and engine-service/ also the strings check (scripts/check-strings.py)
#   native/, the shared actions   their lint check (clang-format, actionlint), the arm64 APK, the emulator suite and
#                                 the real engine on the host
#   Mudlet's build scripts, the Gradle build, the APK scripts
#                                 the jobs that build from them
#   a workflow                    what that workflow runs; ci.yml itself, everything
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mudlet_ref:
        description: Mudlet/Mudlet branch, tag or full commit SHA to build
        default: development
      lua_fortify_fix:
        description: >-
          Emulator jobs: build Lua 5.1 with the Android FORTIFY fix. Off only to show that the smoke test catches the
          abort in luaL_openlibs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # the changed files of a pull request come from the API
      pull-requests: read
    outputs:
      ktlint: ${{ steps.decide.outputs.ktlint }}
      lint-checks: ${{ steps.decide.outputs.lint-checks }}
      libmudlet-android: ${{ steps.decide.outputs.libmudlet-android }}
      desktop-engine: ${{ steps.decide.outputs.desktop-engine }}
      emulator: ${{ steps.decide.outputs.emulator }}
    steps:
      # a push is compared with the commit before it, in git
      - uses: actions/checkout@v7
        if: github.event_name == 'push'

      - id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            everything: &everything
              - .github/workflows/ci.yml
            lint-tools: &lint-tools
              - scripts/lint.sh
              - scripts/lint-requirements.txt
              - .github/workflows/checks.yml
            gradle: &gradle
              - gradle/**
              - gradlew
              - "**/*.gradle.kts"
              - gradle.properties
            shared: &shared
              - .github/actions/**
            apk-scripts: &apk-scripts
              - scripts/build-apk.sh
              - scripts/check-apk.sh
              - scripts/check-apk-size.sh
              - scripts/apk-size-budget.txt
              - scripts/check-licences.py
              - scripts/qt-attributions.py
              - scripts/build-openssl.sh
            mudlet-scripts: &mudlet-scripts
              - scripts/build-mudlet-deps.sh
              - scripts/build-libmudlet.sh
              - scripts/build-libmudlet-desktop.sh
              - scripts/export-libmudlet.py
              - scripts/apply-mudlet-patches.sh
              - scripts/mudlet-patches/**
            kotlin: &kotlin
              - app/**
              - engine-service/**
              - protocol/**
              - suggest/**
            ktlint:
              - "**/*.kt"
              - "**/*.kts"
              - .editorconfig
              - gradle/libs.versions.toml
              - *lint-tools
              - *everything
            clang-format:
              - native/**
              - .clang-format
              - *lint-tools
              - *everything
            shellcheck:
              - "**/*.sh"
              - *lint-tools
              - *everything
            actionlint:
              - .github/workflows/**
              - .github/actions/**
              - *lint-tools
            strings:
              - app/**
              - engine-service/**
              - scripts/check-strings.py
              - *lint-tools
              - *everything
            conflict-markers:
              - "**"
            vendored:
              - scripts/mudlet-patches/**
              - *lint-tools
              - *everything
            games:
              - app/src/main/assets/games/**
              - scripts/sync-mudlet-games.py
              - *lint-tools
              - *everything
            libmudlet-android:
              - *kotlin
              - native/**
              - lint.xml
              - *gradle
              - *apk-scripts
              - *mudlet-scripts
              - *shared
              - .github/workflows/libmudlet.yml
              - *everything
            desktop-engine:
              - native/**
              - protocol/**
              - docs/protocol.md
              - *gradle
              - *mudlet-scripts
              - *shared
              - .github/workflows/libmudlet.yml
              - *everything
            emulator:
              - *kotlin
              - native/**
              - *gradle
              - *apk-scripts
              - *mudlet-scripts
              - *shared
              - .github/workflows/libmudlet.yml
              - *everything

      # The nightly runs what builds Mudlet's development; a manual run runs everything
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ toJSON(steps.filter.outputs) }}
        run: |
          wanted() {
            case "$EVENT" in
              push | pull_request) jq -r --arg k "$1" '.[$k] // "false"' <<< "$CHANGES" ;;
              schedule) case "$1" in libmudlet-android | desktop-engine | emulator) echo true ;; *) echo false ;; esac ;;
              *) case "$1" in emulator) echo true ;; *) echo false ;; esac ;;
            esac
          }
          checks=()
          for check in clang-format shellcheck actionlint strings conflict-markers vendored games; do
            if [ "$(wanted "$check")" = true ]; then checks+=("\"$check\""); fi
          done
          {
            for job in ktlint libmudlet-android desktop-engine emulator; do echo "$job=$(wanted "$job")"; done
            echo "lint-checks=[$(IFS=,; echo "${checks[*]}")]"
          } | tee -a "$GITHUB_OUTPUT"
          echo "Filters the changed files matched: ${{ steps.filter.outputs.changes || 'none applied (a nightly or manual run)' }}" \
            >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: changes
    if: needs.changes.outputs.ktlint == 'true' || needs.changes.outputs.lint-checks != '[]'
    uses: ./.github/workflows/checks.yml
    with:
      ktlint: ${{ needs.changes.outputs.ktlint == 'true' }}
      lint-checks: ${{ needs.changes.outputs.lint-checks }}

  libmudlet:
    needs: changes
    if: >-
      needs.changes.outputs.libmudlet-android == 'true' || needs.changes.outputs.desktop-engine == 'true'
      || needs.changes.outputs.emulator == 'true'
    uses: ./.github/workflows/libmudlet.yml
    with:
      mudlet-ref: ${{ inputs.mudlet_ref || 'development' }}
      # only a manual run has inputs, and it may turn the fix off
      lua-fortify-fix: ${{ github.event_name != 'workflow_dispatch' || inputs.lua_fortify_fix }}
      android: ${{ needs.changes.outputs.libmudlet-android == 'true' }}
      desktop-engine: ${{ needs.changes.outputs.desktop-engine == 'true' }}
      emulator: ${{ needs.changes.outputs.emulator == 'true' }}

  # The check to require: it passes when every job ran that the changes call for, and passed
  result:
    name: CI result
    needs: [changes, checks, libmudlet]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job the changes call for passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CHECKS: ${{ needs.changes.outputs.ktlint == 'true' || (needs.changes.outputs.lint-checks != '[]' && needs.changes.outputs.lint-checks != '') }}
          LIBMUDLET: >-
            ${{ needs.changes.outputs.libmudlet-android == 'true' || needs.changes.outputs.desktop-engine == 'true'
            || needs.changes.outputs.emulator == 'true' }}
        run: |
          result() { jq -r --arg j "$1" '.[$j].result' <<< "$NEEDS"; }
          status=0
          [ "$(result changes)" = success ] || { echo "::error::changes: $(result changes)"; status=1; }
          for pair in "checks:$CHECKS" "libmudlet:$LIBMUDLET"; do
            job=${pair%%:*} wanted=${pair#*:} got=$(result "${pair%%:*}")
            if [ "$wanted" = true ] && [ "$got" != success ]; then
              echo "::error::$job was needed and ended $got"; status=1
            elif [ "$wanted" != true ] && [ "$got" != skipped ]; then
              echo "::error::$job was not needed, yet ended $got"; status=1
            else
              echo "$job: $got (needed: $wanted)"
            fi
          done
          # A skipped job of libmudlet.yml leaves the call successful, so each job it needs must report that it ran
          for job in libmudlet-android desktop-engine emulator; do
            if [ "$(jq -r --arg k "$job" '.changes.outputs[$k]' <<< "$NEEDS")" = true ] \
              && [ "$(jq -r --arg k "$job" '.libmudlet.outputs[$k] // ""' <<< "$NEEDS")" != true ]; then
              echo "::error::libmudlet.yml's $job job was needed and did not run to its end"; status=1
            fi
          done
          exit $status

  # GitHub mails a failed scheduled run only to whoever last edited the cron line
  report-nightly-failure:
    needs: libmudlet
    # a job that hits timeout-minutes is cancelled, not failed
    if: always() && github.event_name == 'schedule' && needs.libmudlet.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly CI against Mudlet development fails"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed or timed out again: $RUN_URL"
          else
            gh issue create --title "$title" \
              --body "The nightly run against Mudlet's \`development\` failed or timed out: $RUN_URL. Close this once it is green again."
          fi
