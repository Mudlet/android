name: APKs

# The app's debug APK for arm64-v8a with the stand-in engine, after the stand-in's desktop test and the Kotlin
# protocol tests (against that desktop engine too), and a second time with its libraries extracted at install. Both
# carry OpenSSL for Qt's TLS backend. The APK with libmudlet as its engine is built in libmudlet.yml.
on:
  push:
    branches: [main]
    paths: &paths
      - app/**
      - engine-service/**
      - protocol/**
      - native/**
      - docs/protocol.md
      - gradle/**
      - gradlew
      - "*.gradle.kts"
      - gradle.properties
      - scripts/build-apk.sh
      - scripts/build-openssl.sh
      - .github/actions/**
      - .github/workflows/apks.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: APK${{ matrix.extracted && ' (extracted libs)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - tests: true
            build: scripts/build-apk.sh
          # what extracting the libraries at install costs; see "Native libraries" in docs/architecture.md
          - build: scripts/build-apk.sh -PextractNativeLibs=true
            extracted: true
    steps:
      - uses: actions/checkout@v6

      - id: toolchain
        uses: ./.github/actions/android-toolchain
        with:
          # host Qt Gui, which the desktop engine links, needs the OpenGL headers to configure and the rest to run
          apt-packages: libgl-dev libopengl-dev libegl1 libxkbcommon0 libfontconfig1

      # Gradle itself is the wrapper's (gradle/wrapper); this caches it and the dependencies, and checks the wrapper jar
      - uses: gradle/actions/setup-gradle@v5

      - name: Stand-in engine desktop test
        if: matrix.tests
        working-directory: native
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build-desktop -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT/gcc_64"
          cmake --build build-desktop --target engine
          python3 tests/test_engine.py build-desktop/enginehost/engine

      # :protocol's tests: the spec check, the run encoding, and the app's EngineLink against the desktop engine
      - name: Kotlin protocol tests
        if: matrix.tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: native/tests/run_jvm_client_test.sh -PqtRoot="$QT_ROOT" -PandroidAbi=arm64-v8a

      - uses: ./.github/actions/android-openssl
        with:
          ndk-version: ${{ steps.toolchain.outputs.ndk-version }}

      - name: Build APK
        run: ${{ matrix.build }}

      - name: Check APK
        uses: ./.github/actions/check-apk
        with:
          apk-dir: app/build/outputs/apk/debug
          engine: libengine
          title: APK${{ matrix.extracted && ' (extracted libs)' || '' }}
          extracted: ${{ matrix.extracted || false }}
          build-tools-dir: ${{ steps.toolchain.outputs.build-tools-dir }}

      - uses: actions/upload-artifact@v6
        with:
          name: mudlet${{ matrix.extracted && '-extracted-libs' || '' }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
