# Shared 4-core machine: keep Gradle small and single-use.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# Qt Gradle Plugin 1.4 configuration (relative paths resolve against the root project)
qtPath=/opt/android-toolchain/qt/6.12.0
qtProjectPath=../qtapp
# Qt 6.12 was built with NDK 27.2 but only 28.2 is installed; Qt's install has no QT_HOST_PATH baked in;
# CMAKE_MAKE_PROGRAM points at a ninja wrapper because the plugin runs "ninja aar" with no -j.
qtExtraCMakeArguments=-DCMAKE_BUILD_TYPE=Release,-DQT_HOST_PATH=/opt/android-toolchain/qt/6.12.0/gcc_64,-DANDROID_NDK_ROOT=/opt/android-toolchain/sdk/ndk/28.2.13676358,-DCMAKE_MAKE_PROGRAM=/home/user/android-prototypes/b-quickview/tools/ninja-j2
