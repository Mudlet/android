name: libmudlet for Android

# Cross-compiles Mudlet's core (mudlet_core, mudlet_headless and the mudlet-headless runner) for arm64-v8a, then
# builds the app's APK with libmudlet as its engine, the one APK to install, with the app's JVM tests and Android lint;
# before that, :suggest's tests, which need no Mudlet. A second job builds libmudlet for the host and runs the engine
# against the fake game server through the socket protocol, from Python and from :protocol's Kotlin client.
# The emulator jobs build it all for x86_64 once, then run the APK on an emulator at the app's minSdk (28) and at the
# newest API (36), one boot each: first the smoke test (native/tests/android_smoke.py), then the instrumented tests
# (native/tests/android_instrumented.py). They are the only jobs that run the real engine on Android.
# ci.yml calls it with the jobs the changes need, and nightly against Mudlet's latest development; a manual run builds
# all of it on any branch. Mudlet's build comes from the cache (.github/actions/libmudlet) when the same Mudlet commit
# was built with the same scripts before.
#
# On this branch the jobs build the script editor's three alternative designs instead (scripts/build-editor-designs.sh):
# "libmudlet" the three arm64-v8a debug APKs to install, each its own artifact, and the emulator jobs the same for
# x86_64 with their tests, which one boot of the API 36 emulator then runs (native/tests/android_editor_designs.py).
# The app's JVM tests, Android lint and the APK checks are main's, where the designs' code is not.
on:
  workflow_call:
    inputs: &inputs
      mudlet-ref:
        description: Mudlet/Mudlet branch, tag or full commit SHA to build
        type: string
        default: development
      lua-fortify-fix:
        description: >-
          Emulator jobs: build Lua 5.1 with the Android FORTIFY fix. Off only to show that the smoke test catches the
          abort in luaL_openlibs
        type: boolean
        default: true
      android:
        description: The arm64-v8a APK with libmudlet
        type: boolean
        default: true
      desktop-engine:
        description: The real engine on the host
        type: boolean
        default: true
      emulator:
        description: The x86_64 APK on the emulators
        type: boolean
        default: true
    # Each "true" once its job has built and tested what it is for, so that ci.yml's "CI result" fails when a job it
    # needs was skipped: a skipped job leaves the call successful
    outputs:
      libmudlet-android:
        value: ${{ jobs.libmudlet.outputs.done }}
      desktop-engine:
        value: ${{ jobs.desktop-engine.outputs.done }}
      emulator:
        value: ${{ jobs.emulator.outputs.done }}
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MUDLET_REF: ${{ inputs.mudlet-ref }}

jobs:
  libmudlet:
    if: inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      done: ${{ steps.done.outputs.done }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Mudlet/Mudlet
          ref: ${{ env.MUDLET_REF }}
          path: mudlet

      - id: toolchain
        uses: ./.github/actions/android-toolchain
        with:
          # lua5.1 writes the translation statistics that mudlet.qrc embeds
          apt-packages: lua5.1

      # Gradle itself is the wrapper's (gradle/wrapper); this caches it and the dependencies, and checks the wrapper jar
      - uses: gradle/actions/setup-gradle@v6

      - id: libmudlet
        uses: ./.github/actions/libmudlet
        with:
          qt-version: ${{ steps.toolchain.outputs.qt-version }}
          ndk-version: ${{ steps.toolchain.outputs.ndk-version }}

      - uses: ./.github/actions/android-openssl
        with:
          ndk-version: ${{ steps.toolchain.outputs.ndk-version }}

      - name: Build the three editor designs' APKs
        run: LIBMUDLET_BUILD_DIR="$GITHUB_WORKSPACE/build" scripts/build-editor-designs.sh designs

      - uses: actions/upload-artifact@v7
        with:
          name: mudlet-editor-design-a-debug-apk
          path: designs/a/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: mudlet-editor-design-b-debug-apk
          path: designs/b/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: mudlet-editor-design-c-debug-apk
          path: designs/c/*.apk
          if-no-files-found: error
          retention-days: 30

      - id: done
        run: echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          FROM_CACHE: ${{ steps.libmudlet.outputs.cache-hit }}
        run: |
          # shellcheck disable=SC2016 # the backticks in git's --format are Markdown
          {
            echo "### libmudlet for Android"
            echo
            echo "Mudlet/Mudlet \`$MUDLET_REF\` at $(git -C mudlet log -1 --format='[`%h`](https://github.com/Mudlet/Mudlet/commit/%H) %s' 2>/dev/null || echo '(not checked out)')"
            echo
            if [ "$FROM_CACHE" = true ]; then echo "libmudlet came from the cache: an earlier run built this commit."; echo; fi
            if [ -f build/size-report.md ]; then cat build/size-report.md; else echo "No size report: the build did not finish."; fi
            echo
            echo "Qt ${{ steps.toolchain.outputs.qt-version }}, NDK ${{ steps.toolchain.outputs.ndk-version }}; dependencies:"
            echo
            sed 's/^/    /' deps/prefix/versions.txt 2>/dev/null || true
            sed -n 's/^openssl /    openssl /p' deps/openssl-arm64-v8a/versions.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  # libmudlet for the host, with the options an Android build has, and the real engine on it, tested through the
  # socket protocol against native/tests/fake_telnet.py
  desktop-engine:
    if: inputs.desktop-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1000M
    outputs:
      done: ${{ steps.done.outputs.done }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Mudlet/Mudlet
          ref: ${{ env.MUDLET_REF }}
          path: mudlet

      - id: toolchain
        uses: ./.github/actions/android-toolchain
        with:
          # Mudlet's other dependencies from the system, as Mudlet's own core-mobile-build workflow takes them; host
          # Qt Gui needs the OpenGL headers to configure and the rest to run, and Qt Multimedia links PulseAudio
          apt-packages: >-
            lua5.1 libboost-dev libhunspell-dev libpcre2-dev libpugixml-dev libsqlite3-dev libyajl-dev libzip-dev
            qtkeychain-qt6-dev zlib1g-dev libgl-dev libopengl-dev libegl1 libxkbcommon0 libfontconfig1 libpulse0

      # The cached host Qt has only what the other jobs need; mudlet_core also needs these, which are small enough
      # to fetch each run and are added beside it without touching what is there
      - name: Host Qt modules for mudlet_core
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-host"
          "$RUNNER_TEMP/aqt-host/bin/pip" install -q "aqtinstall==3.3.0"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aqt-host/bin/aqt" install-qt linux desktop ${{ steps.toolchain.outputs.qt-version }} linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/qt-host" --archives qtsvg -m qt5compat qtmultimedia qtspeech
          cp -r --update=none "$RUNNER_TEMP/qt-host/${{ steps.toolchain.outputs.qt-version }}/gcc_64/." "$QT_ROOT/gcc_64/"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-libmudlet-desktop-${{ github.run_id }}
          restore-keys: ccache-libmudlet-desktop-

      - name: Build libmudlet for the host
        run: |
          ccache -z > /dev/null
          scripts/build-libmudlet-desktop.sh mudlet build-desktop

      - name: Save ccache
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-libmudlet-desktop-${{ github.run_id }}

      - id: engine
        name: Build the engine
        working-directory: native
        run: |
          cmake -S . -B build-desktop-mudlet -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT/gcc_64" \
            -DLIBMUDLET_BUILD_DIR="$GITHUB_WORKSPACE/build-desktop"
          cmake --build build-desktop-mudlet --target engine map_png_test

      - name: Test the real engine
        working-directory: native
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 tests/test_mudlet_engine.py build-desktop-mudlet/enginehost/engine
          python3 tests/test_mudlet_restore.py build-desktop-mudlet/enginehost/engine

      # Runs when the Python tests failed too, so one run shows both
      - name: Test the map's PNG writer
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: native/build-desktop-mudlet/map_png_test app/src/androidTest/assets/map-picture.png

      # Gradle itself is the wrapper's (gradle/wrapper); this caches it and the dependencies
      - uses: gradle/actions/setup-gradle@v6
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}

      # :protocol's tests: the spec check, the run encoding, and the app's EngineLink against the engine just built,
      # which fails rather than skips here when it has no engine (CI=true). They run when the Python tests failed too,
      # so one run shows both.
      - name: Kotlin protocol tests
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: native/tests/run_jvm_client_test.sh -PqtRoot="$QT_ROOT" -PandroidAbi=arm64-v8a

      - id: done
        run: echo "done=true" >> "$GITHUB_OUTPUT"

  # The APK with libmudlet and the two test APKs, built for x86_64 once for the emulator jobs below
  emulator-build:
    if: inputs.emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_ABI: x86_64
    outputs:
      mudlet-commit: ${{ steps.libmudlet.outputs.mudlet-commit }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Mudlet/Mudlet
          ref: ${{ env.MUDLET_REF }}
          path: mudlet

      - id: toolchain
        uses: ./.github/actions/android-toolchain
        with:
          qt-android-arch: android_x86_64
          apt-packages: lua5.1

      - id: libmudlet
        uses: ./.github/actions/libmudlet
        with:
          abi: x86_64
          lua-fortify-fix: ${{ inputs.lua-fortify-fix && '1' || '0' }}
          qt-version: ${{ steps.toolchain.outputs.qt-version }}
          ndk-version: ${{ steps.toolchain.outputs.ndk-version }}

      # Gradle itself is the wrapper's (gradle/wrapper); this caches it and the dependencies, and checks the wrapper jar
      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/android-openssl
        with:
          abi: x86_64
          ndk-version: ${{ steps.toolchain.outputs.ndk-version }}

      - name: Build the three editor designs' APKs and their tests
        run: LIBMUDLET_BUILD_DIR="$GITHUB_WORKSPACE/build" scripts/build-editor-designs.sh designs --tests

      # The unstripped engine goes too, for ndk-stack to name the frames of a crash on the emulator
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-apks${{ !inputs.lua-fortify-fix && '-without-lua-fortify-fix' || '' }}
          path: |
            designs
            native/build-android-x86_64-mudlet/enginehost/libengine_x86_64.so
          if-no-files-found: error
          retention-days: 3

  # One emulator boot per API level runs the smoke test and then the instrumented tests. minSdk 28 runs on every pull
  # request that runs these at all, not only nightly: the code that differs by API level (ServiceCompat's
  # startForeground, the notification permission from 33, the foreground service type from 34) is in the same files
  # whose changes start these jobs, so a nightly-only run would let a crash on Android 9 merge
  emulator:
    name: emulator (API ${{ matrix.api }})
    needs: emulator-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The walk-throughs' pictures need API 31
        api: [36]
    env:
      EMULATOR_API: ${{ matrix.api }}
      LUA_FORTIFY_FIX: ${{ inputs.lua-fortify-fix && '1' || '0' }}
    outputs:
      done: ${{ steps.done.outputs.done }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: emulator-apks${{ !inputs.lua-fortify-fix && '-without-lua-fortify-fix' || '' }}

      # The runner's SDK, which the env context sees only once a step puts it there (the toolchain action does
      # that in the other jobs)
      - name: SDK path
        run: echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the system image
        id: image-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/system-images/android-${{ env.EMULATOR_API }}/google_apis/x86_64
          key: system-image-${{ env.EMULATOR_API }}-google_apis-x86_64-v2

      # Each design's smoke test and walk-through, on one boot; all three run whatever the others did
      - name: The three editor designs on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: google_apis
          arch: x86_64
          # A phone's screen, for the pictures the walk-throughs take
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disk-size: 6G
          script: >-
            python3 native/tests/android_editor_designs.py --apks designs --out device-tests
            --symbols native/build-android-x86_64-mudlet/enginehost

      - id: done
        run: echo "done=true" >> "$GITHUB_OUTPUT"

      # A failed download still leaves the image's directory behind, which would otherwise be cached and restored
      - name: Check the system image installed
        id: image-installed
        if: ${{ !cancelled() && steps.image-cache.outputs.cache-hit != 'true' }}
        env:
          IMAGE_DIR: ${{ env.ANDROID_SDK_ROOT }}/system-images/android-${{ env.EMULATOR_API }}/google_apis/x86_64
        run: |
          if [ -s "$IMAGE_DIR/package.xml" ] && [ -s "$IMAGE_DIR/system.img" ]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$IMAGE_DIR lacks package.xml or system.img: the image did not install, so it is not cached"
          fi

      - name: Save the system image
        if: ${{ !cancelled() && steps.image-installed.outputs.installed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/system-images/android-${{ env.EMULATOR_API }}/google_apis/x86_64
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: emulator-tests-api${{ matrix.api }}${{ env.LUA_FORTIFY_FIX == '0' && '-without-lua-fortify-fix' || '' }}
          path: device-tests
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: editor-design-screenshots
          path: device-tests/*/screenshots
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        env:
          MUDLET_COMMIT: ${{ needs.emulator-build.outputs.mudlet-commit }}
        run: |
          {
            echo "### Emulator (x86_64, API $EMULATOR_API)"
            echo
            echo "Mudlet/Mudlet \`$MUDLET_REF\` at [${MUDLET_COMMIT:0:9}](https://github.com/Mudlet/Mudlet/commit/$MUDLET_COMMIT)"
            echo
            [ "$LUA_FORTIFY_FIX" = 1 ] || echo "Lua 5.1 built without the Android FORTIFY fix"
            for log in device-tests/{a,b,c}/{smoke,instrumented}.log; do
              echo
              if [ -f "$log" ]; then
                echo "$log"
                echo '```'
                cat "$log"
                echo '```'
              else
                echo "No $log: that test did not run."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
