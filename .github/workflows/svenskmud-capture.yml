name: svenskmud capture (throwaway)
on:
  push:
    branches: [ccr-14671218-tf96z6-svenskmud-capture]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Capture what svenskmud.com sends on connect (no login)
        run: |
          mkdir -p capture
          python3 -I .github/capture/svenskmud_capture.py svenskmud.com capture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: svenskmud-capture
          path: capture
