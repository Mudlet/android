# Bounded: three prototypes build on one 4-core machine at the same time
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=false
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
# Qt install holding gcc_64 and android_<abi>; override with -PqtRoot=...
qtRoot=/home/vadi/Programs/Qt/6.12.0
# arm64-v8a for phones, x86_64 for the emulator: -PandroidAbi=x86_64
androidAbi=arm64-v8a
